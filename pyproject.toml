[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gf-account-forge"
version = "0.1.0"
description = "Girls' Frontline 1 account roster extraction and four-dimension tier evaluation (Qt)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.8,<6.13",
  "Pillow>=11",
  "frida==16.5.9",
]

[project.optional-dependencies]
extract = ["UnityPy>=1.20"]

[project.scripts]
gf-account-forge = "app.main:main"

[tool.setuptools]
packages = ["app", "app.capture", "app.core", "app.ui"]

[tool.setuptools.package-data]
app = [
  "data/*.json",
  "data/codex/*.json",
  "data/tierlists/*.json",
]
